name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

env:
  DOCKERHUB_USERNAME: sasidatta

jobs:
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      color: ${{ steps.meta.outputs.color }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Resolve version and theme
        id: meta
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          VER_NUM=${VERSION#v}
          # Golden angle: each version gets a unique hue across the color wheel
          HUE=$(python3 -c "print(($VER_NUM - 1) * 137 % 360)")
          COLOR="hsl($HUE, 65%, 40%)"
          echo "color=$COLOR" >> $GITHUB_OUTPUT

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./mern-docker/frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/mern-docker-frontend:${{ steps.meta.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/mern-docker-frontend:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            PRIMARY_COLOR=${{ steps.meta.outputs.color }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./mern-docker/backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/mern-docker-backend:${{ steps.meta.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/mern-docker-backend:latest

  helm-release:
    name: Update Helm & Create GitHub Release
    runs-on: ubuntu-latest
    needs: docker
    env:
      VERSION: ${{ needs.docker.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Helm chart
        run: |
          # Bump chart patch version
          CHART_VER=$(grep '^version:' mern-docker/helm/mern-app/Chart.yaml | awk '{print $2}')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CHART_VER"
          NEW_CHART_VER="$MAJOR.$MINOR.$((PATCH + 1))"

          sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" mern-docker/helm/mern-app/Chart.yaml
          sed -i "s/^version:.*/version: $NEW_CHART_VER/" mern-docker/helm/mern-app/Chart.yaml

          yq e ".frontend.image.tag = \"$VERSION\"" -i mern-docker/helm/mern-app/values.yaml
          yq e ".backend.image.tag = \"$VERSION\""  -i mern-docker/helm/mern-app/values.yaml

      - name: Commit Helm updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mern-docker/helm/mern-app/Chart.yaml mern-docker/helm/mern-app/values.yaml
          git commit -m "chore: bump helm chart to $VERSION [skip ci]"
          git push origin HEAD:master

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ env.VERSION }}"
          generate_release_notes: true
          body: |
            ## What changed
            See [RELEASES.md](https://github.com/sasidatta/docker_demo/blob/master/RELEASES.md) for full history.

            ## Docker Images
            | Image | Tag |
            |---|---|
            | `sasidatta/mern-docker-frontend` | `${{ env.VERSION }}` |
            | `sasidatta/mern-docker-backend`  | `${{ env.VERSION }}` |

            ## Deploy with Helm
            ```bash
            helm upgrade --install mern ./mern-docker/helm/mern-app \
              --set frontend.image.tag=${{ env.VERSION }} \
              --set backend.image.tag=${{ env.VERSION }}
            ```

            ## Deploy with ArgoCD
            ArgoCD auto-syncs from `mern-docker/helm/mern-app` — no manual action needed.
